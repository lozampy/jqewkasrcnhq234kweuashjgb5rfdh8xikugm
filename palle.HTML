<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Almanacco Storico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #1a1410;
    --ink2: #3d3228;
    --ink3: #6b5c4e;
    --parchment: #f5efe3;
    --parchment2: #ede4d0;
    --parchment3: #e0d4bc;
    --gold: #b8860b;
    --gold2: #d4a017;
    --gold3: #f0c040;
    --red: #8b1a1a;
    --red2: #c0392b;
    --teal: #1a5f5f;
    --teal2: #2e8b8b;
    --line: rgba(90,60,20,0.18);
    --shadow: rgba(30,15,5,0.12);
  }

  body {
    font-family: 'Crimson Pro', Georgia, serif;
    background: var(--parchment);
    color: var(--ink);
    min-height: 100vh;
    padding: 0;
    overflow-x: hidden;
  }

  /* Paper texture via CSS */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 27px,
        rgba(90,60,20,0.06) 27px,
        rgba(90,60,20,0.06) 28px
      );
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 820px;
    margin: 0 auto;
    padding: 0 1.5rem 4rem;
  }

  /* ── MASTHEAD ── */
  .masthead {
    text-align: center;
    padding: 2.5rem 1rem 1.5rem;
    border-bottom: 3px double rgba(90,60,20,0.35);
    margin-bottom: 1.5rem;
  }
  .masthead-vol {
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--ink3);
    margin-bottom: 0.5rem;
  }
  .masthead-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(2.2rem, 6vw, 3.8rem);
    font-weight: 700;
    color: var(--ink);
    line-height: 1;
    letter-spacing: -0.01em;
  }
  .masthead-subtitle {
    font-family: 'Playfair Display', Georgia, serif;
    font-style: italic;
    font-size: clamp(0.9rem, 2.5vw, 1.2rem);
    color: var(--ink3);
    margin-top: 0.35rem;
  }
  .masthead-rule {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin: 1rem 0 0.5rem;
    color: var(--gold);
    font-size: 1rem;
  }
  .masthead-rule::before,
  .masthead-rule::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--gold), transparent);
  }

  /* ── DATE DISPLAY ── */
  .date-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem;
    background: var(--ink);
    color: var(--parchment);
    padding: 0.6rem 1.25rem;
    border-radius: 2px;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    margin-bottom: 1.8rem;
  }
  .date-bar .day-full {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 1.05rem;
  }
  .date-bar .clock {
    font-family: 'Crimson Pro', serif;
    color: var(--gold3);
    font-size: 1.1rem;
  }

  /* ── NAV TABS ── */
  .nav {
    display: flex;
    gap: 0;
    border-bottom: 2px solid var(--parchment3);
    margin-bottom: 2rem;
  }
  .nav-btn {
    font-family: 'Playfair Display', serif;
    font-size: 0.9rem;
    letter-spacing: 0.04em;
    padding: 0.6rem 1.4rem;
    border: none;
    background: transparent;
    color: var(--ink3);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    transition: color 0.2s, border-color 0.2s;
    white-space: nowrap;
  }
  .nav-btn:hover { color: var(--ink); }
  .nav-btn.active {
    color: var(--red);
    border-bottom-color: var(--red);
    font-weight: 700;
  }

  /* ── PANELS ── */
  .panel { display: none; }
  .panel.active { display: block; }

  /* ── SECTION HEADER ── */
  .section-header {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    margin-bottom: 1.5rem;
  }
  .section-header h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--ink);
  }
  .section-header .date-label {
    font-style: italic;
    color: var(--gold);
    font-size: 1.1rem;
  }

  /* ── EVENT CARD ── */
  .event-list { display: flex; flex-direction: column; gap: 0; }
  .event-card {
    display: grid;
    grid-template-columns: 90px 1fr;
    gap: 0;
    border-bottom: 1px solid var(--line);
    padding: 1.1rem 0;
    transition: background 0.15s;
  }
  .event-card:hover { background: rgba(184,134,11,0.04); }
  .event-year {
    font-family: 'Playfair Display', serif;
    font-size: 1.35rem;
    font-weight: 700;
    color: var(--gold);
    line-height: 1;
    padding-top: 2px;
  }
  .event-year .era {
    display: block;
    font-size: 0.65rem;
    font-weight: 400;
    letter-spacing: 0.1em;
    color: var(--ink3);
    margin-top: 2px;
    font-family: 'Crimson Pro', serif;
    font-style: normal;
  }
  .event-desc {
    font-size: 1.05rem;
    line-height: 1.55;
    color: var(--ink2);
  }

  .empty-state {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--ink3);
    font-style: italic;
    font-size: 1.1rem;
    border: 1px dashed var(--parchment3);
    border-radius: 4px;
  }

  /* ── SEARCH PANEL ── */
  .search-form {
    display: flex;
    gap: 0.75rem;
    align-items: flex-end;
    flex-wrap: wrap;
    margin-bottom: 2rem;
    padding: 1.25rem;
    background: var(--parchment2);
    border: 1px solid var(--parchment3);
    border-radius: 3px;
  }
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
  }
  .form-group label {
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink3);
  }
  .form-group select, .form-group input[type=number] {
    font-family: 'Crimson Pro', serif;
    font-size: 1rem;
    padding: 0.4rem 0.65rem;
    border: 1px solid var(--parchment3);
    background: var(--parchment);
    color: var(--ink);
    border-radius: 2px;
    min-width: 100px;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-group select:focus, .form-group input:focus {
    border-color: var(--gold);
  }
  .search-btn {
    font-family: 'Playfair Display', serif;
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    padding: 0.5rem 1.4rem;
    background: var(--ink);
    color: var(--parchment);
    border: none;
    border-radius: 2px;
    cursor: pointer;
    transition: background 0.2s;
    align-self: flex-end;
  }
  .search-btn:hover { background: var(--red); }

  /* ── QUIZ PANEL ── */
  .quiz-card {
    background: var(--parchment2);
    border: 1px solid var(--parchment3);
    border-radius: 4px;
    padding: 1.75rem 2rem;
    position: relative;
  }
  .quiz-date-badge {
    display: inline-block;
    background: var(--ink);
    color: var(--gold3);
    font-family: 'Playfair Display', serif;
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    padding: 0.25rem 0.85rem;
    border-radius: 2px;
    margin-bottom: 1.25rem;
  }
  .quiz-question {
    font-family: 'Playfair Display', serif;
    font-size: 1.25rem;
    line-height: 1.5;
    color: var(--ink);
    margin-bottom: 1.5rem;
    font-style: italic;
  }
  .quiz-hint {
    font-size: 0.85rem;
    color: var(--ink3);
    margin-bottom: 1rem;
  }
  .quiz-input-row {
    display: flex;
    gap: 0.75rem;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 1.5rem;
  }
  .quiz-input {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    width: 140px;
    padding: 0.4rem 0.75rem;
    border: 2px solid var(--parchment3);
    background: var(--parchment);
    color: var(--ink);
    border-radius: 2px;
    text-align: center;
    outline: none;
    transition: border-color 0.2s;
  }
  .quiz-input:focus { border-color: var(--gold); }
  .submit-btn {
    font-family: 'Playfair Display', serif;
    font-size: 0.9rem;
    letter-spacing: 0.05em;
    padding: 0.55rem 1.6rem;
    background: var(--red);
    color: var(--parchment);
    border: none;
    border-radius: 2px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  .submit-btn:hover { background: var(--red2); }
  .submit-btn:active { transform: scale(0.97); }

  /* quiz result */
  .quiz-result {
    display: none;
    margin-top: 0.5rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--line);
  }
  .quiz-result.visible { display: block; }
  .result-verdict {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    margin-bottom: 0.75rem;
  }
  .result-verdict.exact { color: var(--teal); }
  .result-verdict.close { color: var(--gold); }
  .result-verdict.far { color: var(--red); }
  .result-correct {
    font-size: 1rem;
    color: var(--ink3);
    margin-bottom: 1rem;
  }
  .score-bar-wrap {
    margin-bottom: 1.25rem;
  }
  .score-label {
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink3);
    margin-bottom: 0.35rem;
    display: flex;
    justify-content: space-between;
  }
  .score-bar-bg {
    height: 12px;
    background: var(--parchment3);
    border-radius: 2px;
    overflow: hidden;
  }
  .score-bar-fill {
    height: 100%;
    background: linear-gradient(to right, var(--red2), var(--gold2));
    border-radius: 2px;
    transition: width 0.8s cubic-bezier(.22,.68,0,1.2);
    width: 0%;
  }
  .new-quiz-btn {
    font-family: 'Playfair Display', serif;
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    padding: 0.5rem 1.3rem;
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ink3);
    border-radius: 2px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .new-quiz-btn:hover { background: var(--ink); color: var(--parchment); }

  /* stats strip */
  .stats-strip {
    display: flex;
    gap: 1.5rem;
    flex-wrap: wrap;
    margin-top: 2rem;
    padding: 1rem 1.25rem;
    background: var(--parchment2);
    border: 1px solid var(--parchment3);
    border-radius: 3px;
  }
  .stat-item { text-align: center; }
  .stat-val {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--gold);
    display: block;
  }
  .stat-lbl {
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink3);
  }

  /* footer ornament */
  .footer-ornament {
    text-align: center;
    padding: 2rem 0 0;
    color: var(--ink3);
    font-size: 1.1rem;
    letter-spacing: 0.5em;
    opacity: 0.45;
  }

  @media (max-width: 500px) {
    .event-card { grid-template-columns: 70px 1fr; }
    .quiz-card { padding: 1.25rem 1rem; }
  }
</style>
</head>
<body>
<div class="wrapper">

  <header class="masthead">
    <div class="masthead-vol">Anno Domini · Edizione Storica</div>
    <div class="masthead-title">Almanacco</div>
    <div class="masthead-subtitle">Accadde Oggi — Memoria delle Epoche</div>
    <div class="masthead-rule">✦</div>
  </header>

  <div class="date-bar">
    <span class="day-full" id="today-label">—</span>
    <span class="clock" id="clock-display">—</span>
  </div>

  <nav class="nav">
    <button class="nav-btn active" onclick="showPanel('oggi')">Oggi nella Storia</button>
    <button class="nav-btn" onclick="showPanel('cerca')">Ricerca Data</button>
    <button class="nav-btn" onclick="showPanel('quiz')">Quiz Storico</button>
  </nav>

  <!-- OGGI -->
  <section class="panel active" id="panel-oggi">
    <div class="section-header">
      <h2>Questo giorno</h2>
      <span class="date-label" id="oggi-date-label">—</span>
    </div>
    <div class="event-list" id="event-list-oggi"></div>
  </section>

  <!-- CERCA -->
  <section class="panel" id="panel-cerca">
    <div class="search-form">
      <div class="form-group">
        <label>Giorno</label>
        <input type="number" id="input-giorno" min="1" max="31" value="1" style="width:80px">
      </div>
      <div class="form-group">
        <label>Mese</label>
        <select id="input-mese">
          <option value="1">Gennaio</option><option value="2">Febbraio</option>
          <option value="3">Marzo</option><option value="4">Aprile</option>
          <option value="5">Maggio</option><option value="6">Giugno</option>
          <option value="7">Luglio</option><option value="8">Agosto</option>
          <option value="9">Settembre</option><option value="10">Ottobre</option>
          <option value="11">Novembre</option><option value="12">Dicembre</option>
        </select>
      </div>
      <button class="search-btn" onclick="cercaData()">Cerca →</button>
    </div>
    <div class="section-header" id="cerca-header" style="display:none">
      <h2>Risultati</h2>
      <span class="date-label" id="cerca-date-label"></span>
    </div>
    <div class="event-list" id="event-list-cerca"></div>
  </section>

  <!-- QUIZ -->
  <section class="panel" id="panel-quiz">
    <div class="quiz-card" id="quiz-card">
      <div class="quiz-date-badge" id="quiz-date-badge">— —</div>
      <div class="quiz-question" id="quiz-question">Caricamento…</div>
      <div class="quiz-hint" id="quiz-hint"></div>
      <div class="quiz-input-row">
        <input class="quiz-input" type="number" id="quiz-answer" placeholder="Anno" onkeydown="if(event.key==='Enter') submitQuiz()">
        <button class="submit-btn" onclick="submitQuiz()">Risposta →</button>
      </div>
      <div class="quiz-result" id="quiz-result">
        <div class="result-verdict" id="result-verdict"></div>
        <div class="result-correct" id="result-correct"></div>
        <div class="score-bar-wrap">
          <div class="score-label">
            <span>Punteggio</span>
            <span id="score-num">0 / 5000</span>
          </div>
          <div class="score-bar-bg"><div class="score-bar-fill" id="score-bar"></div></div>
        </div>
        <button class="new-quiz-btn" onclick="newQuiz()">Nuovo Quiz ↺</button>
      </div>
    </div>

    <div class="stats-strip" id="stats-strip">
      <div class="stat-item">
        <span class="stat-val" id="stat-partite">0</span>
        <span class="stat-lbl">Partite</span>
      </div>
      <div class="stat-item">
        <span class="stat-val" id="stat-score-tot">0</span>
        <span class="stat-lbl">Punteggio totale</span>
      </div>
      <div class="stat-item">
        <span class="stat-val" id="stat-media">—</span>
        <span class="stat-lbl">Media punti</span>
      </div>
      <div class="stat-item">
        <span class="stat-val" id="stat-best">—</span>
        <span class="stat-lbl">Miglior partita</span>
      </div>
    </div>
  </section>

  <div class="footer-ornament">— ✦ ✦ ✦ —</div>
</div>

function pad2(n) { return n < 10 ? '0'+n : ''+n; }

function formatAnno(a) {
  if (a < 0) return { y: String(-a), era: 'a.C.' };
  return { y: String(a), era: 'd.C.' };
}

function renderEventList(container, giorno, mese) {
  const results = EVENTI.filter(e => e.g === giorno && e.m === mese);
  if (results.length === 0) {
    container.innerHTML = '<div class="empty-state">Nessun evento registrato per questa data nel database.</div>';
    return;
  }
  results.sort((a,b) => a.a - b.a);
  container.innerHTML = results.map(e => {
    const {y, era} = formatAnno(e.a);
    return `<div class="event-card">
      <div class="event-year">${y}<span class="era">${era}</span></div>
      <div class="event-desc">${e.d}</div>
    </div>`;
  }).join('');
}

// ── CLOCK ──
function updateClock() {
  const now = new Date();
  const g = GIORNI_SETT[now.getDay()];
  const d = now.getDate();
  const m = MESI[now.getMonth()];
  const y = now.getFullYear();
  document.getElementById('today-label').textContent = `${g}, ${d} ${m} ${y}`;
  document.getElementById('clock-display').textContent =
    `${pad2(now.getHours())}:${pad2(now.getMinutes())}:${pad2(now.getSeconds())}`;
}
setInterval(updateClock, 1000);
updateClock();

// ── OGGI PANEL ──
(function initOggi() {
  const now = new Date();
  const g = now.getDate(), m = now.getMonth()+1;
  document.getElementById('oggi-date-label').textContent =
    `${g} ${MESI[m-1]}`;
  renderEventList(document.getElementById('event-list-oggi'), g, m);
})();

function cercaData() {
  const g = parseInt(document.getElementById('input-giorno').value);
  const m = parseInt(document.getElementById('input-mese').value);
  const header = document.getElementById('cerca-header');
  header.style.display = 'flex';
  document.getElementById('cerca-date-label').textContent = `${g} ${MESI[m-1]}`;
  renderEventList(document.getElementById('event-list-cerca'), g, m);
}

// ── QUIZ ──
let quizState = { event: null, answered: false };
let quizStats = { partite: 0, totale: 0, best: 0 };

function newQuiz() {
  quizState.answered = false;
  document.getElementById('quiz-result').classList.remove('visible');
  document.getElementById('quiz-answer').value = '';
  document.getElementById('score-bar').style.width = '0%';

  const idx = Math.floor(Math.random() * EVENTI.length);
  quizState.event = EVENTI[idx];
  const e = quizState.event;

  document.getElementById('quiz-date-badge').textContent =
    `${e.g} ${MESI[e.m-1]}`;
  document.getElementById('quiz-question').textContent = e.d;
  document.getElementById('quiz-hint').textContent =
    e.a < 0 ? 'Usa numeri negativi per gli anni a.C. (es. -44)' : '';
  document.getElementById('quiz-answer').focus();
}

function calcolaPunteggio(scarto) {
  if (scarto === 0) return 5000;
  if (scarto >= 500) return 1;
  return 5000 - Math.round((scarto / 500) * 4999);
}

function submitQuiz() {
  if (quizState.answered || !quizState.event) return;
  const val = parseInt(document.getElementById('quiz-answer').value);
  if (isNaN(val)) return;

  quizState.answered = true;
  const corretto = quizState.event.a;
  const scarto = Math.abs(val - corretto);
  const punti = calcolaPunteggio(scarto);

  quizStats.partite++;
  quizStats.totale += punti;
  if (punti > quizStats.best) quizStats.best = punti;

  const verdictEl = document.getElementById('result-verdict');
  const correctEl = document.getElementById('result-correct');

  if (scarto === 0) {
    verdictEl.textContent = '★ Risposta esatta! Complimenti!';
    verdictEl.className = 'result-verdict exact';
    correctEl.textContent = '';
  } else {
    const {y, era} = formatAnno(corretto);
    let commento = '';
    if (scarto === 1) commento = 'Solo 1 anno di scarto — quasi perfetto!';
    else if (scarto <= 10) commento = `Scarto di ${scarto} anni — ottimo!`;
    else if (scarto <= 50) commento = `Scarto di ${scarto} anni — niente male!`;
    else if (scarto <= 150) commento = `Scarto di ${scarto} anni — nella giusta era!`;
    else commento = `Scarto di ${scarto} anni — studia di più!`;

    verdictEl.textContent = commento;
    verdictEl.className = scarto <= 50 ? 'result-verdict close' : 'result-verdict far';
    correctEl.textContent = `La risposta corretta era: ${y} ${era}`;
  }

  document.getElementById('score-num').textContent = `${punti} / 5000`;
  document.getElementById('quiz-result').classList.add('visible');

  setTimeout(() => {
    document.getElementById('score-bar').style.width = ((punti/5000)*100) + '%';
  }, 50);

  document.getElementById('stat-partite').textContent = quizStats.partite;
  document.getElementById('stat-score-tot').textContent = quizStats.totale.toLocaleString('it-IT');
  document.getElementById('stat-media').textContent = Math.round(quizStats.totale / quizStats.partite);
  document.getElementById('stat-best').textContent = quizStats.best;
}

// ── PANEL SWITCHING ──
function showPanel(id) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-'+id).classList.add('active');
  event.currentTarget.classList.add('active');
  if (id === 'quiz' && !quizState.event) newQuiz();
}
